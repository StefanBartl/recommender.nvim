name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  stylua:
    name: stylua (format check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check lua TESTS

  luacheck:
    name: luacheck (lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.1"
      - uses: leafo/gh-actions-luarocks@v4
      - run: luarocks install luacheck
      - run: luacheck lua TESTS

  tests:
    name: tests (headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: recommender.nvim

      # lib.nvim is a real runtime dependency -- recommender.blacklist and
      # recommender.util.lib require it at module load -- so the suite cannot
      # run without it. Checked out as a sibling, which is the layout
      # TESTS/run.lua's own resolver looks for first after $LIB_NVIM_PATH.
      - uses: actions/checkout@v4
        with:
          repository: StefanBartl/lib.nvim
          path: lib.nvim

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Run TESTS/run.lua
        working-directory: recommender.nvim
        run: nvim --headless -u NONE -c "set rtp+=." -l TESTS/run.lua
