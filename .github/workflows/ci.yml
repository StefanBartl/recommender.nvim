name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  stylua:
    name: stylua (format check)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.5.2
          args: --check lua TESTS

  luacheck:
    name: luacheck (lint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.1"
      - uses: leafo/gh-actions-luarocks@v4
      - run: luarocks install luacheck 1.2.0
      - run: luacheck lua TESTS

  tests:
    name: tests (headless) (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # One platform failing must not cancel the others: which of the three
      # broke is the whole information content of this job.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        # Windows runners default to PowerShell; one shell on all three keeps
        # the run step itself from being what differs between platforms.
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          path: recommender.nvim

      # lib.nvim is a real runtime dependency -- recommender.blacklist and
      # recommender.util.lib require it at module load -- so the suite cannot
      # run without it. Checked out as a sibling, which is the layout
      # TESTS/run.lua's own resolver looks for first after $LIB_NVIM_PATH.
      - uses: actions/checkout@v5
        with:
          repository: StefanBartl/lib.nvim
          path: lib.nvim
          ref: ci-verified

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Run TESTS/run.lua
        working-directory: recommender.nvim
        run: |
          exec > >(tee -a "$RUNNER_TEMP/test-output.log") 2>&1
          nvim -n -i NONE --headless -u NONE -c "set rtp+=." -l TESTS/run.lua
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-output-tests-${{ matrix.os }}
          path: ${{ runner.temp }}/test-output.log
          if-no-files-found: ignore
          retention-days: 14
